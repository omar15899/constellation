name: Native workflow

on:
  pull_request:
    paths: ['.codex/**', '.github/**', 'AGENTS.md', 'REVIEW.md', '.gitignore']
  push:
    paths: ['.codex/**', '.github/**', 'AGENTS.md', 'REVIEW.md', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise workflow, review gates and agent policy
        run: python -m unittest discover -s .codex/tests -v
      - name: Check installed concurrency policy
        run: python .codex/agent_policy.py check
      - name: Check whitespace
        run: git diff --check
