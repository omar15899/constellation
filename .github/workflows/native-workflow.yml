name: Native workflow

on:
  pull_request:
    paths: ['.codex/**', '.github/**', 'AGENTS.md', 'REVIEW.md', '.gitignore']
  push:
    paths: ['.codex/**', '.github/**', 'AGENTS.md', 'REVIEW.md', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure isolated concurrency fixture
        env:
          CODEX_HOME: ${{ runner.temp }}/constellation-codex-home
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          policy = json.loads(Path('.codex/agent-policy.json').read_text())
          limit = policy['defaults']['max_concurrent_threads_per_session']
          fixture = Path(os.environ['CODEX_HOME'])
          fixture.mkdir(parents=True, exist_ok=True)
          (fixture / 'config.toml').write_text(
              f'[agents]\nmax_concurrent_threads_per_session = {limit}\n')
          PY
          printf 'CODEX_HOME=%s\n' "$CODEX_HOME" >> "$GITHUB_ENV"
      - name: Exercise workflow, review gates and agent policy
        run: python -m unittest discover -s .codex/tests -v
      - name: Check declared concurrency against CI fixture
        run: python .codex/agent_policy.py check
      - name: Check whitespace
        run: git diff --check

  portable-ecosystem:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate selected skills and shared resources
        run: python .codex/ecosystem/validate.py --root .codex
      - name: Exercise portable state, hooks and installation boundaries
        run: python -B -m unittest discover -s .codex/ecosystem/tests -v
