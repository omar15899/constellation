# registry/perimeters.yaml — perimeter definitions for ~/GitHub/.
#
# Each perimeter is a coherent group of repos that share governance,
# stack expectations, vault home, and tier discipline.
#
# An agent classifying a repo or routing a request must use this file
# to decide which perimeter applies.

schema_version: 1

perimeters:
  quantos-core:
    description: |
      The numerical substrate of QuantOS. Owns the typed primitives
      (KnownAt[T], BLAKE3 audit DAG, Capability), the deterministic
      runtime, and the three causal evaluators (BacktestLab,
      MonteCarloLab, Sweeplab) plus the certified PricingLab.
    tier_range: [0, 1.5]
    stack_default: python
    governance:
      vault_home: ~/OmarOS/05_Projects/QuantOS/
      tier_enforced: true
      import_linter: required
      pre_commit_hooks: required
    members: [Shared, BacktestLab, MonteCarloLab, Sweeplab, PricingLab, MarketDataLab]

  quantos-info:
    description: |
      Information channels — news, experiments, causal inference.
      Consume Tier 1 artefacts and emit FeatureSet / Study / Report /
      CounterfactualEstimate.
    tier_range: [2, 2]
    stack_default: python
    governance:
      vault_home: ~/OmarOS/05_Projects/QuantOS/
      tier_enforced: true
      import_linter: required
      pre_commit_hooks: required
    members: [NewsLab, ResearchLab, IntelligenceLab]

  quantos-alloc:
    description: |
      Portfolio construction and allocation. Sits above information
      channels, below risk/execution.
    tier_range: [2.5, 2.5]
    stack_default: python
    governance:
      vault_home: ~/OmarOS/05_Projects/QuantOS/
      tier_enforced: true
      import_linter: required
      pre_commit_hooks: required
    members: [PortfolioLab]

  quantos-prod:
    description: |
      Production layer — the only repos in the constellation whose
      decisions touch money. RiskLab gates allocations into Orders;
      ExecutionLab owns the order lifecycle and broker adapter.
    tier_range: [3, 3]
    stack_default: python
    governance:
      vault_home: ~/OmarOS/05_Projects/QuantOS/
      tier_enforced: true
      import_linter: required
      pre_commit_hooks: required
      blast_radius: highest
    members: [RiskLab, ExecutionLab]

  quantos-ui:
    description: |
      User-interface surface — the Helix Trading Interface. Outside the
      Python import graph; communicates with QuantOS over HTTP/WS.
    tier_range: [UI, UI]
    stack_default: typescript
    governance:
      vault_home: ~/OmarOS/05_Projects/QuantOS/Labs/tradinginterface/
      tier_enforced: false   # not in the Python import-linter scope
      import_linter: false
      pre_commit_hooks: required
    members: [tradinginterface]

  quantos-orchestration:
    description: |
      End-to-end strategy orchestration — the integration layer that
      composes ResearchLab, MarketDataLab, and BacktestLab and exposes
      typed results to the Trading Interface. Coordinates, never computes:
      only specs, protocols, adapters, registries, and runners. Sits atop
      the whole stack (imports Tiers 0–3) and feeds the UI.
    tier_range: [4, 4]
    stack_default: python
    governance:
      vault_home: ~/OmarOS/05_Projects/QuantOS/
      tier_enforced: true
      import_linter: required
      pre_commit_hooks: required
    members: [StrategyOrchestrationLab]

  adjacent:
    description: |
      Independent projects that happen to live next to QuantOS on disk
      but are NOT bound by QuantOS tier discipline or vault governance.
      Each adjacent repo is self-governing.
    tier_range: null
    stack_default: mixed
    governance:
      vault_home: null
      tier_enforced: false
      import_linter: false
      pre_commit_hooks: optional
    members: [Scilux, MMARV1, KarimSpecificCase]

  external:
    description: |
      Third-party code vendored on disk under ~/GitHub/ for development
      convenience. NOT authored by Omar and NOT under QuantOS governance,
      tier discipline, or vault. Excluded from constellation audits,
      refactors, and peer propagation. Listed only so agents do not
      mistake it for a lab.
    tier_range: null
    stack_default: mixed
    governance:
      vault_home: null
      tier_enforced: false
      import_linter: false
      pre_commit_hooks: optional
    members: [ruflo]

  future:
    description: |
      Reserved namespace for repos that have been planned but are not
      yet on disk. Used to preallocate names and vault links.
    tier_range: null
    stack_default: null
    governance: null
    members: []

# When a new repo appears under ~/GitHub/ that does not match any
# existing perimeter, `repo-classifier` assigns it the perimeter that
# best matches its stack, dependency graph, and CLAUDE.md (if any),
# and proposes the classification for human confirmation before
# editing repos.yaml.
