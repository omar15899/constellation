# registry/levers.yaml — machine-readable registry of research hypotheses ("levers").
#
# Purpose: make Omar's accumulated research methodology persistent. The single
# most expensive recurring failure mode in this constellation is RE-RUNNING A
# DEAD LEVER — a data source, feature family, or sleeve that was already tested
# and refuted in a prior session (GDELT, EDGAR, events, the track-4 zoo were all
# closed as negatives). This registry is the source of truth that:
#   - the SessionStart loader (.claude/hooks/research_session_loader.py) reads to
#     brief each new session on open hypotheses + dead levers;
#   - /gate-check writes to when a verdict is reached;
#   - dead-lever guards consult before an expensive re-run.
#
# Human-readable mirror: research_ledger.md. Promotion bar: contracts/promotion_gate.md.
#
# A "lever" is one falsifiable research hypothesis: "adding X improves metric Y
# of strategy Z under gate G". It is NOT a code task and NOT a per-session loop
# (those live in loop_ledger.md).
#
# Fields per lever:
#   id          — kebab-case unique slug
#   hypothesis  — the falsifiable claim, one sentence
#   strategy    — parent strategy / book the lever feeds
#   repo        — owning repo under ~/GitHub/
#   verdict     — see vocabulary below
#   run_class   — deployable | broad-floor | diagnostic | production  (which run the headline belongs to)
#   metric      — headline result with units, tagged by run_class
#   gate        — which promotion gate was applied + pass fraction (or n/a)
#   evidence    — artifact / report path that backs the verdict (relative to repo, or "memory:<slug>")
#   memory      — auto-memory slug with the long-form record (or null)
#   date        — YYYY-MM-DD the verdict was reached
#   rerun       — false = DO NOT re-run; true = open to re-run with new data/method
#   note        — free text: why, residual caveat, what would reopen it
#
# Verdict vocabulary (canonical — also in contracts/promotion_gate.md):
#   OPEN            — hypothesis stated, not yet tested to a verdict
#   CONFIRMED       — passes the promotion gate; a real, deployable-or-floor edge
#   CAPPED          — real but bounded effect (e.g. de-risks but does not raise Sharpe)
#   NO_IMPROVEMENT  — adds nothing beyond the incumbent baseline
#   REFUTED         — fails the gate / negative result / overfit (PBO high)
#   HOLD            — inconclusive or blocked on data; parked, not closed
#
# Schema version. Bump when fields change.
schema_version: 1
generated_by: gate-check
last_updated: 2026-06-23

# ---------------------------------------------------------------------------
# Strategies / books these levers feed (for grouping in the SessionStart brief).
# ---------------------------------------------------------------------------
