# registry/agents.yaml — constellation-level agent roster.
#
# These are agents that operate across multiple repos. Each is defined
# in ~/GitHub/.claude/agents/<name>.md. Per-repo agents live in
# <repo>/.claude/agents/ and are NOT listed here.

schema_version: 1

agents:
  - name: constellation-cartographer
    model: opus
    role: discovery + classification
    writes: [~/GitHub/.claude/registry/repos.yaml, ~/GitHub/.claude/REPOS.md]
    reads:  [~/GitHub/**]
    spawns: [repo-classifier]
    description: |
      Walks ~/GitHub/, identifies every repo, runs repo-classifier on
      newcomers, and updates the registry + the human-readable index.

  - name: cross-repo-router
    model: opus
    role: free-form request routing
    writes: []
    reads:  [~/GitHub/.claude/registry/**, ~/GitHub/**/CLAUDE.md, ~/GitHub/QUANTOS.md]
    spawns: []
    description: |
      Front door at the constellation plane. Decides perimeter(s),
      repo(s), and recommended downstream entry point for any request.
      Read-only. Never writes.

  - name: multi-repo-orchestrator
    model: opus
    role: multi-repo coordination
    writes: [~/GitHub/**]   # only with explicit user authorisation
    reads:  [~/GitHub/**]
    spawns: [cross-repo-search, cross-repo-router, repo-classifier, perimeter-keeper, import-graph-auditor]
    description: |
      The only constellation agent authorised to write across multiple
      repos in a single workflow. Delegates to per-repo orchestrators.

  - name: cross-repo-search
    model: sonnet
    role: search across the constellation
    writes: []
    reads:  [~/GitHub/**]
    spawns: []
    description: |
      Runs ripgrep / structural / semantic queries across every repo
      with optional perimeter filters.

  - name: repo-classifier
    model: sonnet
    role: classify a single repo
    writes: []   # proposes diffs against repos.yaml; orchestrator applies
    reads:  [<target_repo>/**]
    spawns: []
    description: |
      Given a repo path, computes its perimeter, tier (if applicable),
      role, stack, and status. Output is a proposed repos.yaml entry.

  - name: perimeter-keeper
    model: sonnet
    role: detect perimeter drift
    writes: [~/GitHub/.claude/docs/drift_report.md]
    reads:  [~/GitHub/**]
    spawns: [import-graph-auditor]
    description: |
      Watches for drift between declared perimeters and observed
      behaviour (imports, dependencies, stack). Flags violations.

  - name: import-graph-auditor
    model: sonnet
    role: tier discipline enforcement across labs
    writes: [~/GitHub/.claude/docs/import_audit.md]
    reads:  [~/GitHub/<lab>/.importlinter, ~/GitHub/<lab>/packages/**]
    spawns: []
    description: |
      Walks every QuantOS lab's .importlinter contracts and computes the
      union import graph. Detects tier-inverting imports BEFORE
      pre-commit blocks them.

# Doctrine:
#   - Only `cross-repo-router` and `multi-repo-orchestrator` may dispatch
#     other constellation agents.
#   - No constellation agent writes inside a repo without an explicit
#     user directive routed through the orchestrator.
#   - All constellation agents are READ-ONLY on ~/OmarOS/ — escalate to
#     vault-side orchestrator for vault writes.
