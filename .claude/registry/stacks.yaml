# registry/stacks.yaml — stack profiles by repo.
#
# Cross-repo skills consult this file before running stack-specific
# operations (linting, testing, building, formatting).

schema_version: 1

stacks:
  python-uv-strict:
    description: |
      Modern Python with uv workspace, ruff format/check, mypy strict,
      pytest + hypothesis, import-linter for tier contracts.
    tooling:
      package_manager: uv
      linter: ruff
      formatter: ruff format
      type_checker: mypy --strict
      test_runner: pytest
      property_tests: hypothesis
      import_contracts: import-linter
    files:
      pyproject: pyproject.toml
      lock: uv.lock
      ci: .github/workflows/lint.yml
      import_contracts_file: .importlinter
    members: [Shared, BacktestLab, MonteCarloLab, Sweeplab, PricingLab,
              MarketDataLab, NewsLab, ResearchLab, IntelligenceLab,
              PortfolioLab, RiskLab, ExecutionLab, StrategyOrchestrationLab]

  python-light:
    description: |
      Python without the full QuantOS toolchain. No import-linter,
      no mypy-strict.
    tooling:
      package_manager: pip
    members: [MMARV1]

  typescript-vite:
    description: |
      TypeScript + React + Vite. ESLint + Prettier.
    tooling:
      package_manager: npm
      build: vite
      framework: react
    members: [tradinginterface, Scilux]

  vanilla-web:
    description: |
      Plain HTML/CSS/JS with optional Playwright for testing.
    tooling:
      package_manager: npm
      test: playwright
    members: [KarimSpecificCase]

# Adding a stack:
#   1. Define it here with tooling + members.
#   2. Keep repos.yaml stack values as coarse language categories; these
#      tooling profile names are a separate vocabulary.
#   3. Verify each member's actual tooling before applying profile-specific checks.
