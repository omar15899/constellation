```

## Invariants

- Never auto-merge a PR. The orchestrator opens PRs and reports URLs.
- Never push to `main` directly. Branch + PR, always.
- Never edit a repo's `.claude/` infrastructure during a routine
  cross-repo refactor. Touching a repo's harness is its own,
  separately-authorised operation.
