---
# task-marshal — deterministic tag taxonomy
#
# Every entry is a tag the classifier can assign. A tag fires when ANY of its
# `patterns` matches (case-insensitive, word-boundary regex) somewhere in
# title + body + references + project slug.
#
# `parent` is optional: when a child tag fires, the parent fires too. That is
# how hierarchies work without colon-namespacing — a query for --tag mates
# returns every math task, --tag analisis_funcional only the FA subset.
#
# Patterns are intentionally Spanish+English because Omar's prose is bilingual.
# Accents are optional in most patterns (é? á? í? ó? ú?) because he frequently
# writes without diacritics on a pressed keyboard.
#
# This file is hand-edited. Adding a tag = adding an entry below; no code change.
# Ordering within `tags:` is cosmetic (classifier reads all, matches all).

version: 1

